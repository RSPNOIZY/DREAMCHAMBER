# ═══════════════════════════════════════════════════════════════
# NOIZY EMPIRE — Full Integration Stack
# n8n + PostgreSQL + STT + Cloudflare Tunnel
# ═══════════════════════════════════════════════════════════════
# Run:   docker compose -f ops/docker-compose.yml up -d
# Logs:  docker compose -f ops/docker-compose.yml logs -f n8n
# Down:  docker compose -f ops/docker-compose.yml down
# ═══════════════════════════════════════════════════════════════
# RSP_001 | NOIZY Empire Integration Stack | 2026
# ═══════════════════════════════════════════════════════════════

services:
  # ── PostgreSQL: Persistent Storage for n8n ─────────────────
  postgres:
    image: postgres:16-alpine
    container_name: noizy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-noizy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-noizy-pg-2026}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-noizy} -d ${POSTGRES_DB:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  # ── n8n: Central Automation Brain ──────────────────────────
  n8n:
    image: n8nio/n8n:2.15.0
    container_name: noizy-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      # ── Core Config ──
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - GENERIC_TIMEZONE=America/Toronto
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-default-change-me-in-production}
      # ── Database: PostgreSQL ──
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-noizy}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-noizy-pg-2026}
      # ── Auth ──
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-noizylab}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASS:-noizy-local-2026}
      # ── Webhooks ──
      - WEBHOOK_URL=${WEBHOOK_TUNNEL_URL:-http://localhost:5678}
      - N8N_PAYLOAD_SIZE_MAX=16
      # ── Integration env vars (available in n8n Code nodes) ──
      - NOTION_API_KEY=${NOTION_API_KEY:-}
      - NOTION_EVENTS_DB_ID=${NOTION_EVENTS_DB_ID:-}
      - NOTION_PROJECTS_DB_ID=${NOTION_PROJECTS_DB_ID:-}
      - NOTION_TASKS_DB_ID=${NOTION_TASKS_DB_ID:-}
      - LINEAR_API_KEY=${LINEAR_API_KEY:-}
      - LINEAR_TEAM_ID=${LINEAR_TEAM_ID:-}
      - LINEAR_WEBHOOK_SECRET=${LINEAR_WEBHOOK_SECRET:-}
      - ZAPIER_CATCH_HOOK_URL=${ZAPIER_CATCH_HOOK_URL:-}
      - ZAPIER_NOTIFICATION_HOOK=${ZAPIER_NOTIFICATION_HOOK:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_OWNER=${GITHUB_OWNER:-noizyfish}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - NOIZY_API_KEY=${NOIZY_API_KEY:-}
      - HEAVEN17_URL=${HEAVEN17_URL:-https://heaven17.noizylab.workers.dev}
      - VOICE_AUTH_TOKEN=${VOICE_AUTH_TOKEN:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ${HOME}/NOIZYANTHROPIC/tools/n8n_workflows:/home/node/workflows:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 2G

  # ── STT: Faster-Whisper Speech-to-Text ─────────────────────
  stt:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: noizy-stt
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G

  # ── Redis: Queue & Cache (for n8n scaling later) ───────────
  redis:
    image: redis:7-alpine
    container_name: noizy-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  n8n_data:
    driver: local
  postgres_data:
    driver: local
  hf_cache:
    driver: local
  redis_data:
    driver: local
